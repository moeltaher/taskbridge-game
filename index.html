<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#0d2742" />
<title>خلف الشاشة | v1.0.1</title>
<style>
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#edf3f8}
#app{display:block;width:100%;height:100vh;height:100dvh;border:0;background:#edf3f8}
</style>
</head>
<body>
<iframe id="app" src="app.html" title="لعبة خلف الشاشة"></iframe>
<script>
(function(){
  const frame=document.getElementById('app');
  frame.addEventListener('load',function(){
    try{
      const doc=frame.contentDocument;
      if(!doc)return;
      doc.title='خلف الشاشة | v1.0.1';
      const style=doc.createElement('style');
      style.id='desktop-layout-v1-0-1';
      style.textContent=`
        .app{max-width:1320px!important}
        .topbar-inner{max-width:1320px!important}
        .game-shell{display:block!important;grid-template-columns:none!important}
        @media (min-width:1180px){
          .game-shell.in-game{display:grid!important;grid-template-columns:220px minmax(0,1fr)!important;gap:16px!important}
          .game-shell.in-game .sidebar{display:block!important}
        }
        @media (min-width:940px) and (max-width:1179px){
          .game-shell.in-game{display:block!important;grid-template-columns:none!important}
          .game-shell.in-game .sidebar{display:none!important}
          .stats.active{grid-template-columns:repeat(3,1fr)!important}
          .job-grid{grid-template-columns:repeat(2,1fr)!important}
          .workspace{grid-template-columns:minmax(0,1fr) 280px!important}
          .case-shell{grid-template-columns:220px minmax(0,1fr)!important}
          .hero-grid{grid-template-columns:1fr 1fr!important}
        }
      `;
      doc.head.appendChild(style);
      const subbrand=doc.querySelector('.subbrand');
      if(subbrand)subbrand.textContent='v1.0.1 · محاكاة تفاعلية للعمل الرقمي وعلاقات السلطة';
    }catch(err){console.error('TaskBridge v1.0.1 desktop compatibility layer failed',err);}
  });
})();
</script>
</body>
</html>
