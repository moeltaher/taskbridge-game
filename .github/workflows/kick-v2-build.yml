name: Build isolated v2 branch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kick-v2-build.yml'

permissions:
  contents: write

jobs:
  build-v2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v2-architecture
          fetch-depth: 0
      - name: Extract and run migration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          w=Path('.github/workflows/build-v2-architecture.yml').read_text(encoding='utf-8')
          m=re.search(r"python3 - <<'PY'\n(.*?)\n          PY",w,flags=re.S)
          if not m: raise SystemExit('migration block not found')
          lines=[]
          for line in m.group(1).splitlines():
              lines.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/migrate_v2.py').write_text('\n'.join(lines)+'\n',encoding='utf-8')
          PY
          python3 /tmp/migrate_v2.py
      - name: Validate architecture
        shell: bash
        run: |
          python3 scripts/check.py
          for f in assets/js/data/scenarios.js assets/js/core/state.js assets/js/game/simulation.js assets/js/game/investigation.js assets/js/core/persistence.js assets/js/core/v1-compat.js assets/js/core/routes.js assets/js/core/router.js; do node --check "$f"; done
          test -f scenario/index.html
          test -f work/index.html
          test -f investigation/index.html
          test -f result/index.html
          test -f ARCHITECTURE.md
      - name: Commit tested v2 branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(architecture): release v2.0.0 multi-route modular site" -m "Add route-specific URLs, split source pages and JavaScript by responsibility, externalize shared CSS, preserve v1.1 simulation behavior, and document the build architecture for long-term maintenance."
          git push origin v2-architecture
