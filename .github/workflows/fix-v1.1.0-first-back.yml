name: Fix v1.1.0 first back checkpoint

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-v1.1.0-first-back.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Seed scenario checkpoint
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html');s=p.read_text(encoding='utf-8')
          needle='''  const oldRenderScenarioGrid=renderScenarioGrid;'''
          insert='''  const oldSelectScenario=selectScenario;\n  selectScenario=function(id){oldSelectScenario(id);const snap=snapshotState();navHistory=[{screen:'scenarioScreen',snapshot:deepCopy(snap)},{screen:'contractScreen',snapshot:deepCopy(snap)}];persistNav();syncNavControls();};\n\n  const oldRenderScenarioGrid=renderScenarioGrid;'''
          if needle not in s: raise SystemExit('upgrade insertion point missing')
          s=s.replace(needle,insert,1)
          p.write_text(s,encoding='utf-8')
          wf=Path('.github/workflows/fix-v1.1.0-first-back.yml')
          if wf.exists(): wf.unlink()
          PY
      - name: Validate JavaScript
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          if "navHistory=[{screen:'scenarioScreen'" not in s: raise SystemExit('Scenario checkpoint missing')
          Path('/tmp/taskbridge.js').write_text('\n'.join(re.findall(r'<script[^>]*>(.*?)</script>',s,re.S)),encoding='utf-8')
          PY
          node --check /tmp/taskbridge.js
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(nav): allow back to scenario selection" -m "Seed the scenario-selection checkpoint after choosing a case so Back works from the contract screen as well as later simulation stages."
          git push origin main
