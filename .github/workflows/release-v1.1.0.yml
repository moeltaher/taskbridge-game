name: Release v1.1.0

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v1.1.0.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Implement simulation UX changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          def rep(old,new,count=1):
              global s
              if old not in s:
                  raise SystemExit('Missing expected fragment: '+old[:100])
              s=s.replace(old,new,count)

          def sub(pattern,repl,count=1):
              global s
              s2,n=re.subn(pattern,repl,s,count=count,flags=re.S)
              if n!=count:
                  raise SystemExit(f'Pattern replacement failed ({n}/{count}): {pattern[:100]}')
              s=s2

          rep('<title>خلف الشاشة | v1.0.2</title>','<title>خلف الشاشة | v1.1.0</title>')
          rep('.stats{display:none;grid-template-columns:repeat(6,1fr);gap:8px;margin:0 0 12px}', '.stats{display:none;grid-template-columns:repeat(8,1fr);gap:8px;margin:0 0 12px}')
          rep('.topbar-inner{max-width:1320px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px}', '.topbar-inner{max-width:1320px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand-home{border:0;background:transparent;padding:0;color:inherit;text-align:right;cursor:pointer}.brand-home:hover .logo{transform:translateY(-1px)}.top-actions{display:flex;align-items:center;gap:6px}.top-action{border:1px solid var(--line);background:#fff;color:var(--brand);border-radius:10px;padding:7px 9px;font-size:11px;font-weight:900;min-height:38px}.top-action:disabled{opacity:.4;cursor:not-allowed}.top-action:hover:not(:disabled){background:#edf4fa}')
          rep('.notice.info{background:#eef6ff;border-color:#cfe0f2;color:#244f7c}', '.notice.info{background:#eef6ff;border-color:#cfe0f2;color:#244f7c}.impact-card{border:2px solid #f0d9ad;background:#fffaf0;border-radius:16px;padding:14px;margin:12px 0}.impact-card h3{margin-top:0}.impact-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.impact-item{border:1px solid #ead9b7;background:#fff;border-radius:11px;padding:9px}.impact-item small{display:block;color:var(--muted);font-size:10px}.impact-item b{font-size:16px}.impact-item.unpaid{border-color:#efcbc7;background:#fff4f2}.impact-item.unpaid b{color:var(--bad)}')
          rep('.pilot-meta{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}', '.pilot-meta{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}')
          rep('@media(max-width:700px){.settings-grid,.rights-grid{grid-template-columns:1fr}.a11y-alt .choices{grid-template-columns:1fr}.pilot-meta{grid-template-columns:1fr}}', '@media(max-width:700px){.settings-grid,.rights-grid{grid-template-columns:1fr}.a11y-alt .choices{grid-template-columns:1fr}.pilot-meta,.impact-grid{grid-template-columns:1fr 1fr}}')
          rep('@media (max-width:560px){.app{padding:8px 9px 90px}', '@media (max-width:560px){.app{padding:8px 9px 90px}')
          rep('.bottom-actions button{padding:8px 7px;font-size:11px}}', '.bottom-actions button{padding:8px 7px;font-size:11px}.top-action span{display:none}.top-action{padding:7px 9px}.impact-grid{grid-template-columns:1fr 1fr}}')

          old_header='''      <div class="brand-wrap"><div class="logo">TB</div><div><div class="brand">TaskBridge</div><div class="subbrand">v1.0.2 · محاكاة تفاعلية للعمل الرقمي وعلاقات السلطة</div></div></div>\n      <div class="phase" id="phaseLabel">قبل الوردية</div>'''
          new_header='''      <button class="brand-home brand-wrap" onclick="goHome()" aria-label="العودة إلى الصفحة الرئيسية"><div class="logo">TB</div><div><div class="brand">TaskBridge</div><div class="subbrand">v1.1.0 · محاكاة كاملة للعمل الرقمي وعلاقات السلطة</div></div></button>\n      <div class="top-actions"><button class="top-action" id="backBtn" onclick="goBack()" disabled>↩ <span>رجوع</span></button><button class="top-action" onclick="restartGame()">↻ <span>بدء من جديد</span></button><div class="phase" id="phaseLabel">قبل الوردية</div></div>'''
          rep(old_header,new_header)

          old_intro='''          <div class="eyebrow">لعبة تدريبية · 12–25 دقيقة بحسب النمط</div>'''
          rep(old_intro,'''          <div class="eyebrow">محاكاة كاملة · نحو 20–25 دقيقة</div>''')
          sub(r'''\n          <h3>اختر نمط اللعب</h3>\n          <div class="mode-grid">.*?</div>\n          <div class="resume-banner''', '''\n          <div class="notice good"><b>محاكاة كاملة واحدة</b><br><span class="small">ستمر بجميع مراحل العمل: تنفيذ المهام، الإدارة الخوارزمية، المراقبة، المخاطر، النزاع، الدفع، ثم التحقيق وتحليل علاقة العمل.</span></div>\n          <div class="resume-banner''')

          rep('<section class="screen" id="connectionScreen"><div class="panel"><div class="instruction"><span class="n">8</span><div><b>مخاطر العمل</b><small>نوع الخطر يختلف بحسب طبيعة العمل، لكن أثره قد يظهر في الوقت أو الدخل أو الصحة أو الاستقرار.</small></div></div><div class="risk-visual"><div><div class="risk-icon" id="riskIcon">⚠</div><h2 id="riskTitle">حدث أثناء العمل</h2><p id="riskText"></p></div></div><div class="cost-grid" id="costGrid"></div><div class="notice" id="riskNotice"></div><div class="actions"><button class="btn" onclick="afterRisk()">متابعة الوردية</button></div></div></section>', '<section class="screen" id="connectionScreen"><div class="panel"><div class="instruction"><span class="n">8</span><div><b>مخاطر العمل</b><small>نوع الخطر يختلف بحسب طبيعة العمل، لكن أثره قد يظهر في الوقت أو الدخل أو الصحة أو الاستقرار.</small></div></div><div class="risk-visual"><div><div class="risk-icon" id="riskIcon">⚠</div><h2 id="riskTitle">حدث أثناء العمل</h2><p id="riskText"></p></div></div><div id="riskImpact"></div><div class="cost-grid" id="costGrid"></div><div class="notice" id="riskNotice"></div><div class="actions"><button class="btn" onclick="afterRisk()">متابعة الوردية</button></div></div></section>')
          rep('<div class="pilot-meta"><div class="metric"><small>زمن المشاركة الفعلي</small><b id="realElapsed">—</b></div><div class="metric"><small>زمن العمل المحاكى</small><b id="simElapsed">—</b></div><div class="metric"><small>نتيجة الوصول</small><b id="resultOutcome">—</b></div></div>', '<div class="pilot-meta"><div class="metric"><small>زمن المشاركة الفعلي</small><b id="realElapsed">—</b></div><div class="metric"><small>زمن الوردية المحاكى</small><b id="simElapsed">—</b></div><div class="metric"><small>الوقت غير المدفوع</small><b id="unpaidElapsed">—</b></div><div class="metric"><small>نتيجة الوصول</small><b id="resultOutcome">—</b></div></div>')

          sub(r'''let state=\{\};\nlet selectedMode='quick';\nlet facilitator=.*?function currentGoal\(\)\{return state\.scenario\?\(state\.mode==='quick'\?state\.scenario\.goalQuick:state\.scenario\.goalFull\):0;\}''', '''let state={};\nlet selectedMode='full';\nlet facilitator={groupName:'',lockScenario:'',showScore:true};\nlet comparisonResults=[];\nlet lastFocusedElement=null;\nlet navHistory=[];\nconst SAVE_KEY='taskbridge_final_progress_v1', SETTINGS_KEY='taskbridge_final_settings_v1', RESULTS_KEY='taskbridge_final_results_v1';\nfunction setMode(){selectedMode='full';if(state)state.mode='full';}\nfunction newState(){navHistory=[];state={mode:'full',scenario:null,scenarioKey:null,wallet:0,grossWorker:0,clientPaid:0,time:0,paidTime:0,unpaidTime:0,quality:92,acceptance:100,acceptedOffers:10,offerDecisions:10,access:72,stress:22,status:'غير نشط',jobsDone:0,rejections:0,rejectedJobs:[],marketRefresh:false,selectedJob:null,secondOffer:null,workAnswers:[],workScore:0,rushAccepted:null,tookBreak:null,appealed:null,disputeSeverity:0,disputeIndex:0,accountOutcome:null,riskEvent:null,riskApplied:false,evidence:['contract','ownTools','multiPlatform'],log:[],evidenceSort:{},answers:{},power:{},payment:null,currentScreen:'introScreen',analysisText:'',conclusionEvidence:[],selectedRights:[],rightsSummaryShown:false,realStartedAt:null,realFinishedAt:null,resultData:null};axes.forEach(a=>state.power[a.id]={worker:25,platform:25,client:25,mediator:25});}\nfunction currentGoal(){return state.scenario?state.scenario.goalFull:0;}''')

          sub(r'''function go\(id\)\{.*?\}\nfunction addLog''', '''function snapshotState(){const copy=JSON.parse(JSON.stringify(state));copy.scenario=null;return copy;}\nfunction rememberScreen(id){if(!state?.scenario)return;const snap=snapshotState(),last=navHistory[navHistory.length-1];if(last&&last.screen===id)navHistory[navHistory.length-1]={screen:id,snapshot:snap};else navHistory.push({screen:id,snapshot:snap});if(navHistory.length>20)navHistory.shift();syncNavControls();}\nfunction restoreSnapshot(snap){state=JSON.parse(JSON.stringify(snap));state.mode='full';state.scenario=state.scenarioKey?scenarios[state.scenarioKey]:null;axes.forEach(a=>{if(!state.power?.[a.id]){state.power=state.power||{};state.power[a.id]={worker:25,platform:25,client:25,mediator:25};}});}\nfunction syncNavControls(){const b=$('backBtn');if(b)b.disabled=navHistory.length<2;}\nfunction showScreen(id,record=true){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));const target=$(id);if(!target)return;target.classList.add('active');window.scrollTo({top:0,behavior:'smooth'});const [pct,label]=stages[id]||[0,''];$('phaseLabel').textContent=label;$('progressBar').style.width=pct+'%';$('progressText').textContent=pct+'%';$('progressStage').textContent=label;const inGame=!['introScreen','scenarioScreen'].includes(id);$('progressShell').classList.toggle('active',inGame);$('statsBar').classList.toggle('active',inGame);$('gameShell').classList.toggle('in-game',inGame);$('bottomActions').classList.toggle('active',inGame&&!['resultScreen','rightsScreen'].includes(id));if(state){state.currentScreen=id;state.mode='full';renderStats();if(record)rememberScreen(id);saveGame();}if(id==='scenarioScreen')renderScenarioGrid();if(id==='evidenceScreen')renderEvidenceSort();setTimeout(()=>{const h=target.querySelector('h1,h2');if(h){h.setAttribute('tabindex','-1');h.focus({preventScroll:true});}},80);}\nfunction go(id){showScreen(id,true);}\nfunction goBack(){if(navHistory.length<2){live('لا توجد خطوة سابقة متاحة.');return;}if(!confirm('العودة إلى الخطوة السابقة ستلغي القرارات والأحداث التي وقعت بعدها. هل تريد المتابعة؟'))return;navHistory.pop();const prev=navHistory[navHistory.length-1];restoreSnapshot(prev.snapshot);rehydrate(prev.screen,true);syncNavControls();live('تمت العودة إلى الخطوة السابقة وإلغاء ما جاء بعدها.');}\nfunction goHome(){if(state?.scenario){saveGame();if(!confirm('العودة إلى الصفحة الرئيسية؟ سيتم حفظ تقدمك ويمكنك متابعة الجلسة لاحقًا.'))return;}document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));$('introScreen').classList.add('active');$('phaseLabel').textContent='قبل الوردية';$('progressShell').classList.remove('active');$('statsBar').classList.remove('active');$('gameShell').classList.remove('in-game');$('bottomActions').classList.remove('active');if(hasSavedGame())$('resumeBanner')?.classList.add('active');window.scrollTo({top:0,behavior:'smooth'});}\nfunction restartGame(){if(state?.scenario&&!confirm('بدء محاكاة جديدة؟ سيُحذف تقدم الجولة الحالية من هذا الجهاز.'))return;discardSavedGame(false);newState();renderWorldMap();document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));$('introScreen').classList.add('active');$('phaseLabel').textContent='قبل الوردية';$('progressShell').classList.remove('active');$('statsBar').classList.remove('active');$('gameShell').classList.remove('in-game');$('bottomActions').classList.remove('active');syncNavControls();window.scrollTo({top:0,behavior:'smooth'});live('بدأت محاكاة جديدة.');}\nfunction addLog''')

          sub(r'''function renderStats\(\)\{.*?\}\n\nfunction avatarSVG''', '''function renderStats(){if(!state.scenario){$('statsBar').innerHTML='';return;}const accessLabel=state.access>=75?'مرتفع':state.access>=50?'متوسط':'منخفض',stressLabel=state.stress>=70?'مرتفع':state.stress>=40?'متوسط':'منخفض',earned=state.grossWorker,total=Math.max(1,state.time),unpaidPct=Math.round(state.unpaidTime/total*100);$('statsBar').innerHTML=`<div class="stat"><small>المقابل المستحق</small><b>${money(earned)}</b><div class="microbar"><i style="width:${clamp((earned/currentGoal())*100,0,100)}%;background:var(--good)"></i></div></div><div class="stat"><small>وقت الوردية</small><b>${state.time} د</b><div class="microbar"><i style="width:${clamp(state.time/45*100,0,100)}%"></i></div></div><div class="stat"><small>وقت مدفوع</small><b>${state.paidTime} د</b><div class="microbar"><i style="width:${clamp(state.paidTime/total*100,0,100)}%;background:var(--good)"></i></div></div><div class="stat"><small>غير مدفوع</small><b style="color:${state.unpaidTime?'var(--bad)':'inherit'}">${state.unpaidTime} د · ${unpaidPct}%</b><div class="microbar"><i style="width:${unpaidPct}%;background:var(--bad)"></i></div></div><div class="stat"><small>الجودة</small><b>${state.quality}%</b><div class="microbar"><i style="width:${state.quality}%;background:${state.quality>=80?'var(--good)':'var(--bad)'}"></i></div></div><div class="stat"><small>معدل القبول</small><b>${state.acceptance}%</b><div class="microbar"><i style="width:${state.acceptance}%"></i></div></div><div class="stat"><small>الوصول</small><b>${accessLabel}</b><div class="microbar"><i style="width:${state.access}%;background:var(--platform)"></i></div></div><div class="stat"><small>الضغط</small><b>${stressLabel}</b><div class="microbar"><i style="width:${state.stress}%;background:${state.stress>=70?'var(--bad)':'var(--warn)'}"></i></div></div>`;$('sideStatus').textContent=state.status;$('sideScenario').textContent=state.scenario.role;}\n\nfunction impactHTML(title,minutes,moneyAdded=0,stressDelta=0){return `<div class="impact-card"><h3>أثر الحدث عليك</h3><p class="small">${title}</p><div class="impact-grid"><div class="impact-item"><small>وقت الوردية</small><b>+${minutes} د</b></div><div class="impact-item unpaid"><small>وقت مدفوع</small><b>+0 د</b></div><div class="impact-item unpaid"><small>المقابل الإضافي</small><b>+${money(moneyAdded)}</b></div><div class="impact-item"><small>الضغط</small><b>${stressDelta>=0?'+':''}${stressDelta}</b></div></div><p class="small"><b>المعنى:</b> قضيت وقتًا إضافيًا مرتبطًا بالعمل، لكن مستحقاتك لم ترتفع مقابل هذا الوقت.</p></div>`;}\n\nfunction avatarSVG''')

          rep('<div class="fact"><small>هدف المستحقات</small><b>${money(s.goalQuick)}–${money(s.goalFull)}</b></div>', '<div class="fact"><small>هدف المستحقات</small><b>${money(s.goalFull)}</b></div>')
          rep("$('goalText').textContent=`الوصول إلى ${money(currentGoal())} من المقابل المستحق قبل تكاليف التشغيل (${state.mode==='quick'?'تدريب سريع':'محاكاة كاملة'})`;", "$('goalText').textContent=`الوصول إلى ${money(currentGoal())} من المقابل المستحق قبل تكاليف التشغيل (محاكاة كاملة)`;")

          sub(r'''function rushDecision\(accepted\)\{.*?\}\nfunction renderMonitoring''', '''function rushDecision(accepted){state.rushAccepted=accepted;state.offerDecisions++;if(accepted){state.acceptedOffers++;recalcAcceptance();const o=state.secondOffer;state.wallet+=o.pay;state.grossWorker+=o.pay;state.clientPaid+=o.clientValue;state.time+=o.duration;state.paidTime+=o.duration;state.jobsDone++;state.stress=clamp(state.stress+(o.premium?18:22),0,100);state.access=clamp(state.access+5,0,100);addLog('قبلت العرض الثاني',`أكملت ${o.title} مقابل ${money(o.pay)}. ارتفع المقابل المستحق والوصول، وارتفع الضغط.`);$('rushMsg').innerHTML=`<div class="notice good">أضفت ${money(o.pay)} إلى مستحقاتك، لكن مؤشر الضغط ارتفع.</div>`;}else{recalcAcceptance();state.rejections++;state.access=clamp(state.access-2,0,100);state.stress=clamp(state.stress-4,0,100);addEvidence('decline');addLog('رفضت العرض الثاني','استطعت الرفض دون غرامة مالية مباشرة، لكن معدل القبول تغير.');$('rushMsg').innerHTML='<div class="notice">رفضت العرض. لم تُخصم أموال، لكن معدل القبول تغير ضمن ملف الأداء.</div>';}renderStats();saveGame();setTimeout(()=>{renderMonitoring();go('monitorScreen');},450);}\nfunction renderMonitoring''')

          sub(r'''function breakDecision\(take\)\{.*?\}\nfunction renderCosts''', '''function breakDecision(take){state.tookBreak=take;if(take){state.time+=1;state.unpaidTime+=1;state.stress=clamp(state.stress-14,0,100);addLog('أخذت استراحة قصيرة','انخفض الضغط، وسُجلت دقيقة توقف إضافية غير مدفوعة.');$('breakMsg').innerHTML=impactHTML('اخترت استراحة قصيرة أثناء الوردية.',1,0,-14);}else{state.stress=clamp(state.stress+14,0,100);addLog('واصلت دون استراحة','استمر النشاط وارتفع الضغط.');$('breakMsg').innerHTML='<div class="notice">حافظت على النشاط، لكن مؤشر الضغط ارتفع. لم يضف هذا القرار وقتًا غير مدفوعًا.</div>';}renderStats();saveGame();setTimeout(()=>{renderRiskEvent();go('connectionScreen');},450);}\nfunction renderCosts''')

          sub(r'''function renderRiskEvent\(\)\{.*?\}\nfunction afterRisk\(\)\{.*?\}\nfunction annotationPresets''', '''function renderRiskEvent(){if(!state.riskEvent)state.riskEvent=riskProfile();const r=state.riskEvent;if(!state.riskApplied){state.time+=r.minutes;state.unpaidTime+=r.minutes;state.stress=clamp(state.stress+r.stress,0,100);state.riskApplied=true;addLog('حدث خطر أثناء العمل',`${r.title}: ${r.minutes} دقيقة غير مدفوعة، دون مقابل إضافي.`);addEvidence('risk');}$('riskIcon').textContent=r.icon;$('riskTitle').textContent=r.title;$('riskText').textContent=r.text;$('riskImpact').innerHTML=impactHTML(r.title,r.minutes,0,r.stress);$('riskNotice').className='notice '+(state.scenario.type==='moderation'?'bad':'');$('riskNotice').innerHTML=`<b>من تحمل الأثر؟</b> ${r.notice}`;const c=state.scenario.costs;$('costGrid').innerHTML=`<div class="cost"><small>الإنترنت</small><b>${money(c.internet)}</b></div><div class="cost"><small>الكهرباء</small><b>${money(c.electricity)}</b></div><div class="cost"><small>استهلاك الجهاز</small><b>${money(c.device)}</b></div><div class="cost"><small>إجمالي الوقت غير المدفوع حتى الآن</small><b>${state.unpaidTime} د</b></div>`;renderStats();saveGame();}\nfunction afterRisk(){renderDispute();go('disputeScreen');}\nfunction annotationPresets''')

          sub(r'''function renderPayment\(\)\{.*?\}\nfunction goSuspension''', '''function renderPayment(){const p=state.payment,total=Math.max(1,state.time),unpaidPct=Math.round(state.unpaidTime/total*100);$('moneyFlow').innerHTML=`<div class="money-node"><small>فواتير العملاء</small><b>${money(p.clientPaid)}</b></div><div class="money-arrow">←</div><div class="money-node"><small>المقابل المتفق عليه</small><b>${money(p.contracted)}</b></div><div class="money-arrow">←</div><div class="money-node"><small>المتاح للتحويل</small><b>${money(p.workerBeforeCosts)}</b></div>`;$('receiptBox').innerHTML=`<div class="receipt-row"><span>فواتير العملاء للمشروعات</span><b>${money(p.clientPaid)}</b></div><div class="receipt-row"><span>فرق الخدمة/إيراد المنصة قبل مصروفاتها</span><b>${money(p.platformService)}</b></div><div class="receipt-row"><span>المقابل الذي وافق عليه العامل</span><b>${money(p.contracted)}</b></div><div class="receipt-row"><span>حجز نزاع جودة</span><b>-${money(p.hold)}</b></div><div class="receipt-row"><span>DataConnect</span><b>-${money(p.mediator)}</b></div><div class="receipt-row"><span>رسوم تحويل</span><b>-${money(p.transfer)}</b></div><div class="receipt-row"><span><b>المتاح للتحويل قبل تكاليف التشغيل</b></span><b>${money(p.workerBeforeCosts)}</b></div><div class="receipt-row"><span>إنترنت + كهرباء + استهلاك جهاز</span><b>-${money(p.operating)}</b></div><div class="receipt-row"><span>إجمالي وقت الوردية</span><b>${state.time} د</b></div><div class="receipt-row"><span>وقت مدفوع</span><b>${state.paidTime} د</b></div><div class="receipt-row" style="color:var(--bad)"><span><b>وقت غير مدفوع</b></span><b>${state.unpaidTime} د · ${unpaidPct}%</b></div><div class="receipt-row total"><span>الصافي بعد تكاليف العامل</span><b>${money(p.net)}</b></div>`;const rate=state.time?p.net/state.time*60:0;$('effectiveRate').textContent=money(rate);addLog('ظهرت تسوية المدفوعات',`إجمالي الوردية ${state.time} دقيقة، منها ${state.unpaidTime} دقيقة غير مدفوعة. الصافي بعد تكاليف العامل ${money(p.net)}.`);renderStats();saveGame();}\nfunction goSuspension''')

          rep("$('simElapsed').textContent=state.time+' د';$('resultOutcome').textContent=outcomeLabel();", "$('simElapsed').textContent=state.time+' د';$('unpaidElapsed').textContent=state.unpaidTime+' د ('+Math.round(state.unpaidTime/Math.max(1,state.time)*100)+'%)';$('resultOutcome').textContent=outcomeLabel();")
          rep("version:'TaskBridge v1.0.2'", "version:'TaskBridge v1.1.0'")
          rep("mode:state.mode,score:", "mode:'full',paidMinutes:state.paidTime,unpaidMinutes:state.unpaidTime,score:")
          sub(r'''function saveSettings\(\)\{.*?\}\nfunction loadSettings\(\)\{.*?\}''', '''function saveSettings(){try{localStorage.setItem(SETTINGS_KEY,JSON.stringify({facilitator}));}catch(e){}}\nfunction loadSettings(){try{const x=JSON.parse(localStorage.getItem(SETTINGS_KEY)||'null');if(x)facilitator={...facilitator,...(x.facilitator||{})};selectedMode='full';}catch(e){selectedMode='full';}}''')
          sub(r'''function saveGame\(\)\{.*?\}\nfunction discardSavedGame''', '''function saveGame(){if(!state?.scenario)return;try{const copy=snapshotState(),historyCopy=navHistory.map(x=>({screen:x.screen,snapshot:x.snapshot}));localStorage.setItem(SAVE_KEY,JSON.stringify({state:copy,history:historyCopy}));$('resumeBanner')?.classList.add('active');}catch(e){}}\nfunction discardSavedGame''')
          sub(r'''function resumeGame\(\)\{.*?\}\nfunction rehydrate\(id\)\{''', '''function resumeGame(){try{const raw=JSON.parse(localStorage.getItem(SAVE_KEY)||'null');if(!raw)return;const saved=raw.state||raw;if(!saved.scenarioKey)return;state=saved;state.mode='full';selectedMode='full';navHistory=Array.isArray(raw.history)?raw.history:[];state.scenario=scenarios[state.scenarioKey];axes.forEach(a=>{if(!state.power[a.id])state.power[a.id]={worker:25,platform:25,client:25,mediator:25};});rehydrate(state.currentScreen||'contractScreen',navHistory.length>0);if(!navHistory.length)rememberScreen(state.currentScreen||'contractScreen');syncNavControls();}catch(e){alert('تعذر استعادة الجلسة المحفوظة.');}}\nfunction rehydrate(id,fromHistory=false){''')
          rep("else if(id==='rightsScreen'){renderRightsScreen();}go(id);}", "else if(id==='rightsScreen'){renderRightsScreen();}showScreen(id,!fromHistory);}")
          sub(r'''function hasSavedGame\(\)\{.*?\}\nfunction initApp\(\)\{.*?\}\n''', '''function hasSavedGame(){try{const x=JSON.parse(localStorage.getItem(SAVE_KEY)||'null');return !!(x?.state?.scenarioKey||x?.scenarioKey)}catch(e){return false}}\nfunction initApp(){loadSettings();selectedMode='full';syncFacilitatorUI();renderWorldMap();syncNavControls();if(hasSavedGame())$('resumeBanner')?.classList.add('active');history.replaceState({taskbridge:true},'');history.pushState({taskbridge:true},'');window.addEventListener('popstate',()=>{if(state?.scenario&&navHistory.length>=2){goBack();history.pushState({taskbridge:true},'');}});document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('docModal').classList.contains('open'))closeDoc();else if($('drawer').classList.contains('open'))closeDrawer();}});}\n''')

          rep("<p><b>المجموعة:</b> ${escapeHTML(p.groupName)} · <b>الحالة:</b> ${escapeHTML(p.scenarioName)} · <b>النمط:</b> ${p.mode==='quick'?'تدريب سريع':'محاكاة كاملة'}</p>", "<p><b>المجموعة:</b> ${escapeHTML(p.groupName)} · <b>الحالة:</b> ${escapeHTML(p.scenarioName)} · <b>النمط:</b> محاكاة كاملة</p>")
          rep("<p><b>زمن المشاركة:</b> ${p.realMinutes} دقيقة · <b>زمن العمل المحاكى:</b> ${p.simMinutes} دقيقة · <b>نتيجة الوصول:</b> ${outcomeLabel()}</p>", "<p><b>زمن المشاركة:</b> ${p.realMinutes} دقيقة · <b>زمن الوردية:</b> ${p.simMinutes} دقيقة · <b>وقت مدفوع:</b> ${state.paidTime} دقيقة · <b>وقت غير مدفوع:</b> ${state.unpaidTime} دقيقة · <b>نتيجة الوصول:</b> ${outcomeLabel()}</p>")
          rep("<div class=\"metric\"><small>وقت الوردية</small><b>${state.time} د</b></div><div class=\"metric\"><small>وقت غير مدفوع</small><b>${state.unpaidTime} د</b></div>", "<div class=\"metric\"><small>وقت الوردية</small><b>${state.time} د</b></div><div class=\"metric\"><small>وقت مدفوع</small><b>${state.paidTime} د</b></div><div class=\"metric\"><small>وقت غير مدفوع</small><b>${state.unpaidTime} د</b></div>")

          s=s.replace("v1.0.2 · محاكاة تفاعلية", "v1.1.0 · محاكاة كاملة")
          s=s.replace("TaskBridge v1.0.2", "TaskBridge v1.1.0")
          p.write_text(s,encoding='utf-8')

          readme=Path('README.md').read_text(encoding='utf-8')
          readme=readme.replace('**الإصدار الحالي: v1.0.2**','**الإصدار الحالي: v1.1.0**',1)
          marker='## سجل الإصدارات\n\nتفاصيل التغييرات موثقة في [`CHANGELOG.md`](CHANGELOG.md).\n'
          section='''\n### v1.1.0 — تجربة محاكاة كاملة وتنقل قابل للتراجع\n\n- أزيل نمط التدريب السريع؛ اللعبة تعمل الآن كمحاكاة كاملة واحدة.\n- أضيفت أزرار الرجوع والبدء من جديد والعودة إلى الرئيسية من شعار TaskBridge.\n- الرجوع يستعيد نقطة حفظ سابقة ويلغي القرارات التي جاءت بعدها.\n- أصبح الوقت المدفوع وغير المدفوع ظاهرًا في مؤشرات الوردية والتسوية والنتيجة.\n- أحداث المخاطر تعرض أثرها المالي والزمني فور وقوعها.\n'''
          if marker in readme and '### v1.1.0' not in readme:
              readme=readme.replace(marker,marker+section,1)
          Path('README.md').write_text(readme,encoding='utf-8')

          changelog=Path('CHANGELOG.md').read_text(encoding='utf-8')
          heading='## [1.0.2] - 2026-08-20'
          entry='''## [1.1.0] - 2026-08-20\n\n### Added\n\n- نظام تنقل بنقاط حفظ يتيح الرجوع إلى المرحلة السابقة مع إلغاء القرارات اللاحقة.\n- زر بدء من جديد متاح دائمًا مع تأكيد قبل حذف تقدم الجولة.\n- شعار TaskBridge يعيد إلى الصفحة الرئيسية مع الاحتفاظ بالجلسة لاستئنافها.\n- دعم زر الرجوع في المتصفح أثناء المحاكاة.\n- مؤشرات مستقلة لإجمالي وقت الوردية، الوقت المدفوع، والوقت غير المدفوع.\n- بطاقات أثر فورية توضح كيف تؤثر الاستراحة والمخاطر في الوقت والمقابل والضغط.\n- عرض نسبة الوقت غير المدفوع في التسوية والنتيجة النهائية.\n\n### Changed\n\n- إلغاء نمط التدريب السريع واعتماد المحاكاة الكاملة بوصفها المسار الوحيد.\n- تطبيق أثر أحداث الوقت غير المدفوع لحظة ظهور الحدث بدل تأجيله إلى زر المتابعة.\n- توسيع كشف الدفع والتقرير ليشملا الوقت المدفوع وغير المدفوع.\n\n### Compatibility\n\n- يمكن استعادة ملفات الحفظ القديمة من v1.0.x؛ تحول الجلسة المستعادة تلقائيًا إلى نمط المحاكاة الكاملة.\n\n'''
          if heading not in changelog:
              raise SystemExit('CHANGELOG v1.0.2 heading missing')
          changelog=changelog.replace(heading,entry+heading,1)
          Path('CHANGELOG.md').write_text(changelog,encoding='utf-8')

          Path('RELEASE_NOTES_v1.1.0.md').write_text('''# Release v1.1.0 — Full Simulation UX\n\nيركز هذا الإصدار على وضوح تجربة العامل وقدرته على التحكم في مسار المحاكاة.\n\n## أهم التغييرات\n\n- اللعبة الآن محاكاة كاملة واحدة؛ أزيل التدريب السريع من الواجهة والمنطق.\n- الوقت غير المدفوع لم يعد مجرد نص: يظهر فورًا في شريط الحالة وبطاقات الأثر والتسوية والنتيجة.\n- أحداث مثل انقطاع الاتصال، إعادة العمل، انتهاء المهلة، وقت التعافي والاستراحة توضح الزيادة في وقت الوردية مقابل صفر زيادة في المقابل.\n- أضيف رجوع حقيقي يعتمد على نقاط حفظ، بحيث يؤدي الرجوع إلى إلغاء القرارات اللاحقة بدل مجرد عرض شاشة قديمة.\n- أضيف بدء من جديد، وعمل شعار TaskBridge كرابط للرئيسية مع حفظ التقدم.\n- أضيف دعم لسلوك زر Back في المتصفح داخل المحاكاة.\n\n## سلامة المنطق\n\nلم تتغير السيناريوهات الأساسية أو نموذج تحليل السلطة أو حساب درجة الاتساق. التغيير يركز على مسار المحاكاة، وضوح الوقت/الأجر، والتنقل.\n''',encoding='utf-8')

          wf=Path('.github/workflows/release-v1.1.0.yml')
          if wf.exists(): wf.unlink()
          PY

      - name: Validate HTML and JavaScript
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          required=['v1.1.0','function goBack()','function restartGame()','وقت غير مدفوع','riskImpact','selectedMode=\'full\'']
          missing=[x for x in required if x not in s]
          if missing: raise SystemExit('Missing required features: '+', '.join(missing))
          if 'modeQuick' in s or "state.mode==='quick'" in s:
              raise SystemExit('Quick mode remnants remain')
          scripts=re.findall(r'<script>(.*?)</script>',s,re.S)
          if len(scripts)!=1: raise SystemExit('Expected one inline script')
          Path('/tmp/taskbridge.js').write_text(scripts[0],encoding='utf-8')
          print('HTML feature checks passed')
          PY
          node --check /tmp/taskbridge.js

      - name: Commit v1.1.0
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(simulation): release v1.1.0 full simulation UX" -m "Remove quick mode, make unpaid time immediately visible, add checkpoint-based back navigation, home/restart controls, browser-back handling, and document paid vs unpaid time throughout settlement and results."
          git push origin main
