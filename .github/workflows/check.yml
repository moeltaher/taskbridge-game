name: No Boss checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Route shell drift check
        run: node scripts/generate-pages.mjs --check
      - name: Structural checks
        run: node scripts/structural-check.mjs
      - name: Regression checks
        run: node scripts/check.mjs
      - name: Domain rule checks
        run: node scripts/domain-check.mjs
      - name: JavaScript syntax checks
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find assets/js scripts tests -type f \( -name '*.js' -o -name '*.mjs' \) -print0)
      - name: Install browser-test dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser E2E checks
        run: npm run test:e2e
