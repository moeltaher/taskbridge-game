name: No Boss checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Route shell drift check
        run: npm run check:routes
      - name: Structural checks
        run: npm run check:structural
      - name: Regression checks
        run: npm run check:regression
      - name: Domain rule checks
        run: npm run check:domain
      - name: Semantic invariant checks
        run: npm run check:semantic
      - name: JavaScript syntax checks
        run: npm run check:syntax
      - name: Install browser-test dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser E2E checks
        run: npm run test:e2e
      - name: Upload visual review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-review
          path: test-results/**/*.png
          if-no-files-found: ignore
          retention-days: 7
