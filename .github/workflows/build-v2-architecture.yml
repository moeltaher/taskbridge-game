name: Build v2 architecture

on:
  push:
    branches: [v2-architecture]
    paths:
      - '.github/workflows/build-v2-architecture.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v2-architecture
          fetch-depth: 0

      - name: Refactor monolith into modular multi-route site
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, json, shutil

          root=Path('.')
          old=(root/'index.html').read_text(encoding='utf-8')

          # Extract CSS, body, and scripts from the proven v1.1.0 build.
          styles='\n\n'.join(re.findall(r'<style[^>]*>(.*?)</style>', old, flags=re.S))
          scripts=re.findall(r'<script[^>]*>(.*?)</script>', old, flags=re.S)
          if len(scripts)<2:
              raise SystemExit('Expected v1.1 runtime and upgrade scripts')
          runtime=scripts[0].strip()
          upgrade='\n\n'.join(s.strip() for s in scripts[1:])
          body=re.search(r'<body>(.*)</body>',old,flags=re.S).group(1)
          body=re.sub(r'<script[^>]*>.*?</script>','',body,flags=re.S)

          # Extract every screen section and keep the common shell separately.
          main_match=re.search(r'(<main class="main">)(.*?)(</main>)',body,flags=re.S)
          if not main_match:
              raise SystemExit('Main game container not found')
          main_inner=main_match.group(2)
          sections=[]
          for m in re.finditer(r'<section class="screen(?: active)?" id="([^"]+)">.*?</section>',main_inner,flags=re.S):
              sections.append((m.group(1),m.group(0)))
          if len(sections)<15:
              raise SystemExit(f'Expected game screens; found {len(sections)}')
          before=body[:main_match.start(2)]
          after=body[main_match.end(2):]

          groups={
            'home':['introScreen'],
            'scenario':['scenarioScreen'],
            'onboarding':['contractScreen'],
            'work':['marketScreen','workScreen','workResultScreen'],
            'management':['rankingScreen','rushScreen','monitorScreen'],
            'risk':['connectionScreen'],
            'dispute':['disputeScreen'],
            'payment':['paymentScreen'],
            'access':['suspensionScreen'],
            'investigation':['caseScreen','evidenceScreen','questionsScreen'],
            'power':['powerScreen'],
            'conclusion':['conclusionScreen'],
            'result':['resultScreen'],
            'rights':['rightsScreen'],
          }
          section_map=dict(sections)
          missing=[sid for ids in groups.values() for sid in ids if sid not in section_map]
          if missing:
              raise SystemExit('Missing screen sections: '+','.join(missing))

          # Source tree: each logical area has its own editable fragment.
          src_pages=root/'src/pages'; src_pages.mkdir(parents=True,exist_ok=True)
          for route,ids in groups.items():
              text='\n\n'.join(section_map[x] for x in ids)+'\n'
              (src_pages/f'{route}.html').write_text(text,encoding='utf-8')

          # Shared layout contains one insertion point for all editable page fragments.
          layout=before+'{{SCREENS}}'+after
          layout=layout.replace('v1.1.0','v2.0.0')
          layout=re.sub(r'<div class="subbrand">.*?</div>', '<div class="subbrand">v2.0.0 · محاكاة كاملة متعددة الصفحات</div>', layout, count=1, flags=re.S)
          (root/'src').mkdir(exist_ok=True)
          (root/'src/layout.html').write_text(layout.strip()+'\n',encoding='utf-8')

          # CSS: preserve proven visual rules in game.css; new architectural layers stay isolated.
          cssdir=root/'assets/css'; cssdir.mkdir(parents=True,exist_ok=True)
          (cssdir/'base.css').write_text('''/* v2 base layer: project-wide primitives */\n:root{--route-max:1320px}\nhtml{scroll-behavior:smooth}\nbody[data-route]{min-height:100vh}\n''',encoding='utf-8')
          (cssdir/'layout.css').write_text('''/* v2 layout layer: route and navigation behavior */\n.route-debug{display:none}\n.brand-home{cursor:pointer}\n@media(max-width:700px){.top-actions{gap:4px}}\n''',encoding='utf-8')
          (cssdir/'components.css').write_text('''/* v2 reusable component layer */\n.route-link{display:inline-flex;align-items:center;gap:6px;text-decoration:none}\n''',encoding='utf-8')
          (cssdir/'game.css').write_text(styles.strip()+'\n',encoding='utf-8')

          # Split the original runtime into concern-oriented files while preserving global behavior/order.
          markers={
            'state':'let state={};',
            'simulation':'function avatarSVG',
            'investigation':'function openCaseFile',
            'persistence':'function saveSettings',
          }
          idx={k:runtime.find(v) for k,v in markers.items()}
          if any(v<0 for v in idx.values()):
              raise SystemExit('Runtime split marker missing: '+repr(idx))
          jsroot=root/'assets/js'; (jsroot/'data').mkdir(parents=True,exist_ok=True); (jsroot/'core').mkdir(parents=True,exist_ok=True); (jsroot/'game').mkdir(parents=True,exist_ok=True)
          (jsroot/'data/scenarios.js').write_text(runtime[:idx['state']].strip()+'\n',encoding='utf-8')
          (jsroot/'core/state.js').write_text(runtime[idx['state']:idx['simulation']].strip()+'\n',encoding='utf-8')
          (jsroot/'game/simulation.js').write_text(runtime[idx['simulation']:idx['investigation']].strip()+'\n',encoding='utf-8')
          (jsroot/'game/investigation.js').write_text(runtime[idx['investigation']:idx['persistence']].strip()+'\n',encoding='utf-8')
          (jsroot/'core/persistence.js').write_text(runtime[idx['persistence']:].strip()+'\n',encoding='utf-8')
          (jsroot/'core/v1-compat.js').write_text(upgrade.strip()+'\n',encoding='utf-8')

          route_screen={
            '':'introScreen','scenario':'scenarioScreen','onboarding':'contractScreen','work':'marketScreen','management':'rankingScreen','risk':'connectionScreen','dispute':'disputeScreen','payment':'paymentScreen','access':'suspensionScreen','investigation':'caseScreen','power':'powerScreen','conclusion':'conclusionScreen','result':'resultScreen','rights':'rightsScreen'
          }
          screen_route={sid:route for route,ids in groups.items() for sid in ids}
          screen_route['introScreen']=''
          routes_js='window.TB_ROUTE_SCREEN='+json.dumps(route_screen,ensure_ascii=False)+';\nwindow.TB_SCREEN_ROUTE='+json.dumps(screen_route,ensure_ascii=False)+';\n'
          (jsroot/'core/routes.js').write_text(routes_js,encoding='utf-8')

          router=r'''(function(){
  'use strict';
  const routeScreen=window.TB_ROUTE_SCREEN||{};
  const screenRoute=window.TB_SCREEN_ROUTE||{};
  const routeNames=new Set(Object.keys(routeScreen).filter(Boolean));

  function basePath(){
    const bits=location.pathname.split('/').filter(Boolean);
    if(bits.length && routeNames.has(bits[bits.length-1])) bits.pop();
    return '/'+(bits.length?bits.join('/')+'/':'');
  }
  const BASE=basePath();
  function pathForScreen(id){const r=screenRoute[id]||'';return BASE+(r?r+'/':'');}
  function currentRoute(){const bits=location.pathname.split('/').filter(Boolean);const last=bits[bits.length-1]||'';return routeNames.has(last)?last:'';}
  window.TaskBridgeRoutes={base:BASE,pathForScreen,currentRoute,routeScreen,screenRoute};

  const legacyGo=window.go;
  if(typeof legacyGo==='function'){
    window.go=function(id){
      legacyGo(id);
      const target=pathForScreen(id);
      if(location.pathname!==target) history.pushState({taskbridgeRoute:true,screen:id},'',target);
    };
  }
  const legacyHome=window.goHome;
  window.goHome=function(){
    if(typeof legacyHome==='function') legacyHome();
    const target=BASE;if(location.pathname!==target) history.pushState({taskbridgeRoute:true,screen:'introScreen'},'',target);
  };

  function reconcileRoute(){
    const route=currentRoute();
    const requested=routeScreen[route]||'introScreen';
    if(route && !state?.scenario){location.replace(BASE);return;}
    if(state?.scenario){
      const saved=state.currentScreen||requested;
      const savedRoute=screenRoute[saved]||'';
      const target=(savedRoute===route)?saved:requested;
      try{rehydrate(target);}catch(e){console.error('Route hydration failed',e);location.replace(BASE);}
    }else if(requested!=='introScreen') location.replace(BASE);
  }

  window.addEventListener('popstate',()=>{
    const route=currentRoute(),requested=routeScreen[route]||'introScreen';
    if(requested==='introScreen'){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));document.getElementById('introScreen')?.classList.add('active');return;}
    if(state?.scenario){try{rehydrate(requested);}catch(e){location.replace(BASE);}}
  });

  document.addEventListener('DOMContentLoaded',()=>{
    document.body.dataset.route=currentRoute()||'home';
    setTimeout(reconcileRoute,0);
  });
})();
'''
          (jsroot/'core/router.js').write_text(router,encoding='utf-8')

          # Architecture documentation.
          (root/'ARCHITECTURE.md').write_text('''# TaskBridge v2 Architecture\n\n## Public routes\n\n- `/` home\n- `/scenario/` case selection\n- `/onboarding/` contract\n- `/work/` marketplace + task + task result\n- `/management/` ranking + second offer + monitoring\n- `/risk/` work risk\n- `/dispute/` quality dispute\n- `/payment/` settlement\n- `/access/` account/project access\n- `/investigation/` case file + evidence + questions\n- `/power/` power map\n- `/conclusion/` conclusion\n- `/result/` result\n- `/rights/` rights map\n\n## Source of truth\n\nEdit `src/pages/*.html` for page-specific markup. Shared structure lives in `src/layout.html`. Shared styles live in `assets/css/`. Runtime logic is split by concern in `assets/js/`. Generated public route pages should not be hand-edited.\n\n## JavaScript responsibilities\n\n- `data/scenarios.js`: scenario data, power targets, evidence templates.\n- `core/state.js`: state model, shared helpers, base screen navigation.\n- `game/simulation.js`: marketplace, work, monitoring, risks, disputes, payments, access.\n- `game/investigation.js`: evidence, questions, power mapping, scoring, reports, rights.\n- `core/persistence.js`: local storage, settings, resume, initialization.\n- `core/v1-compat.js`: compatibility behavior retained from v1.1.0 while v2 is stabilized.\n- `core/routes.js` and `core/router.js`: public URL routing.\n\n## Build\n\nRun `python3 scripts/build.py` after editing source fragments. GitHub Actions can later run this automatically on source changes.\n''',encoding='utf-8')

          # Build script used for future maintenance.
          scriptsdir=root/'scripts'; scriptsdir.mkdir(exist_ok=True)
          buildpy=r'''from pathlib import Path
import re
ROOT=Path(__file__).resolve().parents[1]
ROUTES=['home','scenario','onboarding','work','management','risk','dispute','payment','access','investigation','power','conclusion','result','rights']
PUBLIC={'home':'','scenario':'scenario','onboarding':'onboarding','work':'work','management':'management','risk':'risk','dispute':'dispute','payment':'payment','access':'access','investigation':'investigation','power':'power','conclusion':'conclusion','result':'result','rights':'rights'}
ORDER=ROUTES

def build():
    layout=(ROOT/'src/layout.html').read_text(encoding='utf-8')
    screens='\n\n'.join((ROOT/f'src/pages/{x}.html').read_text(encoding='utf-8') for x in ORDER)
    shell=layout.replace('{{SCREENS}}',screens)
    head_links='''<link rel="stylesheet" href="__P__assets/css/base.css"><link rel="stylesheet" href="__P__assets/css/layout.css"><link rel="stylesheet" href="__P__assets/css/components.css"><link rel="stylesheet" href="__P__assets/css/game.css">'''
    script_links='''<script src="__P__assets/js/data/scenarios.js"></script><script src="__P__assets/js/core/state.js"></script><script src="__P__assets/js/game/simulation.js"></script><script src="__P__assets/js/game/investigation.js"></script><script src="__P__assets/js/core/persistence.js"></script><script src="__P__assets/js/core/v1-compat.js"></script><script src="__P__assets/js/core/routes.js"></script><script src="__P__assets/js/core/router.js"></script>'''
    doc='<!doctype html>\n<html lang="ar" dir="rtl">\n<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0d2742"><title>خلف الشاشة | v2.0.0</title>'+head_links+'</head>\n<body>'+shell+script_links+'</body>\n</html>\n'
    for name in ROUTES:
        route=PUBLIC[name]
        prefix='./' if route=='' else '../'
        out=doc.replace('__P__',prefix)
        if route=='': target=ROOT/'index.html'
        else:
            d=ROOT/route; d.mkdir(exist_ok=True); target=d/'index.html'
        target.write_text(out,encoding='utf-8')
if __name__=='__main__': build()
'''
          (scriptsdir/'build.py').write_text(buildpy,encoding='utf-8')

          # Generate all public pages now.
          import subprocess
          subprocess.run(['python3','scripts/build.py'],check=True)

          # Add automated structural checks.
          checkpy=r'''from pathlib import Path
import re,sys
R=Path(__file__).resolve().parents[1]
routes=['index.html','scenario/index.html','onboarding/index.html','work/index.html','management/index.html','risk/index.html','dispute/index.html','payment/index.html','access/index.html','investigation/index.html','power/index.html','conclusion/index.html','result/index.html','rights/index.html']
for f in routes:
    p=R/f
    assert p.exists(), f'missing {f}'
    s=p.read_text(encoding='utf-8')
    assert 'assets/js/core/router.js' in s, f'router missing in {f}'
    assert 'v2.0.0' in s, f'version missing in {f}'
for f in ['src/pages/home.html','src/pages/work.html','src/pages/investigation.html','assets/js/core/state.js','assets/js/game/simulation.js','assets/js/game/investigation.js','ARCHITECTURE.md']:
    assert (R/f).exists(), f'missing source {f}'
print('v2 structural checks passed')
'''
          (scriptsdir/'check.py').write_text(checkpy,encoding='utf-8')

          # Update README and changelog.
          readme=(root/'README.md').read_text(encoding='utf-8')
          readme=re.sub(r'\*\*الإصدار الحالي: v[^*]+\*\*','**الإصدار الحالي: v2.0.0**',readme,count=1)
          readme+='''\n\n## بنية v2\n\nأصبح المشروع متعدد الروابط ومقسّم المصدر. راجع [`ARCHITECTURE.md`](ARCHITECTURE.md). ملفات `src/pages/` هي مصدر شاشات اللعبة، و`assets/js/` يفصل المنطق بحسب المسؤولية، و`assets/css/` يجمع الطبقات البصرية المشتركة.\n'''
          (root/'README.md').write_text(readme,encoding='utf-8')
          changelog=(root/'CHANGELOG.md').read_text(encoding='utf-8')
          entry='''## [2.0.0] - 2026-08-20\n\n### Architecture\n\n- تحويل اللعبة من صفحة URL واحدة إلى موقع ثابت متعدد الروابط المنطقية.\n- إضافة 13 مسارًا عامًا للمراحل الرئيسية مع دعم التحديث المباشر والعودة عبر المتصفح.\n- فصل شاشات المصدر في `src/pages/`، والأنماط في `assets/css/`، ومنطق JavaScript حسب المسؤولية في `assets/js/`.\n- إضافة `scripts/build.py` لبناء الصفحات العامة من مصدر واحد ومنع تكرار الصيانة.\n- إضافة `ARCHITECTURE.md` لتوثيق حدود كل ملف وطريقة التطوير المستقبلية.\n\n### Compatibility\n\n- الحفاظ على منطق المحاكاة الكامل، السيناريوهات، الوقت المدفوع وغير المدفوع، الاستئناف المحلي، التقارير، الأدلة، وخريطة السلطة من v1.1.0.\n- GitHub Pages ما زال يعمل دون backend أو framework.\n\n'''
          pos=changelog.find('## [')
          changelog=(changelog[:pos]+entry+changelog[pos:]) if pos>=0 else entry+changelog
          (root/'CHANGELOG.md').write_text(changelog,encoding='utf-8')
          (root/'RELEASE_NOTES_v2.0.0.md').write_text('''# TaskBridge v2.0.0 — Multi-route modular architecture\n\nهذا الإصدار يعيد تنظيم اللعبة لتسهيل الصيانة والتطوير طويل الأجل. لكل مجموعة من مراحل اللعبة رابط عام مستقل، بينما تبقى حالة اللاعب محفوظة محليًا وتتحرك بين الروابط دون فقدان التقدم.\n\n## أبرز التغييرات\n\n- روابط مستقلة للمراحل الرئيسية.\n- مصدر HTML مقسم حسب الصفحة في `src/pages/`.\n- JavaScript مقسم إلى بيانات، حالة، محاكاة، تحقيق، تخزين، وتوجيه.\n- CSS مشترك في `assets/css/`.\n- سكربت بناء واحد يولد صفحات GitHub Pages العامة.\n- لا حاجة إلى React أو Vue أو backend.\n''',encoding='utf-8')

          # Remove temporary migration workflow itself from final tree.
          wf=root/'.github/workflows/build-v2-architecture.yml'
          if wf.exists(): wf.unlink()
          PY

      - name: Validate JavaScript and generated routes
        shell: bash
        run: |
          python3 scripts/check.py
          for f in assets/js/data/scenarios.js assets/js/core/state.js assets/js/game/simulation.js assets/js/game/investigation.js assets/js/core/persistence.js assets/js/core/v1-compat.js assets/js/core/routes.js assets/js/core/router.js; do
            node --check "$f"
          done

      - name: Commit v2 architecture
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(architecture): release v2.0.0 multi-route modular site" -m "Add route-specific URLs, split source pages and JavaScript by responsibility, externalize shared CSS, preserve v1.1 simulation behavior, and add build/architecture documentation for long-term maintenance."
          git push origin v2-architecture
