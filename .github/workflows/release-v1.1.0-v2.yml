name: Release v1.1.0 v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v1.1.0-v2.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply v1.1.0 compatibility upgrade
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, traceback

          try:
              p=Path('index.html')
              s=p.read_text(encoding='utf-8')
              if 'id="taskbridge-v110-upgrade"' in s:
                  raise SystemExit('v1.1.0 upgrade already present')

              s=s.replace('<title>خلف الشاشة | v1.0.2</title>','<title>خلف الشاشة | v1.1.0</title>',1)
              s=s.replace('v1.0.2 · محاكاة كاملة للعمل الرقمي وعلاقات السلطة','v1.1.0 · محاكاة كاملة للعمل الرقمي وعلاقات السلطة')
              s=s.replace('v1.0.2 · محاكاة تفاعلية للعمل الرقمي وعلاقات السلطة','v1.1.0 · محاكاة كاملة للعمل الرقمي وعلاقات السلطة')

              css=r'''
<style id="taskbridge-v110-style">
.topbar-inner{gap:8px}.brand-home{border:0;background:transparent;padding:0;color:inherit;text-align:right;cursor:pointer}.brand-home:hover .logo{transform:translateY(-1px)}
.top-actions{display:flex;align-items:center;gap:6px;margin-inline-start:auto}.top-action{border:1px solid var(--line);background:#fff;color:var(--brand);border-radius:10px;padding:7px 9px;font-size:11px;font-weight:900;min-height:38px}.top-action:disabled{opacity:.4;cursor:not-allowed}
.stats.active{grid-template-columns:repeat(8,minmax(0,1fr))}.impact-card{border:2px solid #f0d9ad;background:#fffaf0;border-radius:16px;padding:14px;margin:12px 0}.impact-card h3{margin-top:0}.impact-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.impact-item{border:1px solid #ead9b7;background:#fff;border-radius:11px;padding:9px}.impact-item small{display:block;color:var(--muted);font-size:10px}.impact-item b{font-size:16px}.impact-item.unpaid{border-color:#efcbc7;background:#fff4f2}.impact-item.unpaid b{color:var(--bad)}
@media(max-width:1179px){.stats.active{grid-template-columns:repeat(4,minmax(0,1fr))}}@media(max-width:700px){.impact-grid{grid-template-columns:1fr 1fr}}@media(max-width:560px){.stats.active{grid-template-columns:repeat(2,minmax(0,1fr))}.top-action span{display:none}.top-action{padding:7px}.phase{display:none}}
</style>
'''
              s=s.replace('</head>',css+'\n</head>',1)

              upgrade=r'''
<script id="taskbridge-v110-upgrade">
(function(){
  'use strict';
  const NAV_KEY='taskbridge_nav_v110';
  let navHistory=[];
  let restoring=false;
  const deepCopy=o=>JSON.parse(JSON.stringify(o));

  selectedMode='full';
  if(state) state.mode='full';

  const oldNewState=newState;
  newState=function(){navHistory=[];oldNewState();selectedMode='full';state.mode='full';state.riskApplied=false;syncNavControls();};
  setMode=function(){selectedMode='full';if(state)state.mode='full';};
  currentGoal=function(){return state.scenario?state.scenario.goalFull:0;};

  function snapshotState(){const x=deepCopy(state);x.scenario=null;delete x._navHistory;return x;}
  function restoreSnapshot(x){state=deepCopy(x);state.mode='full';state.scenario=state.scenarioKey?scenarios[state.scenarioKey]:null;if(state.riskApplied===undefined)state.riskApplied=false;axes.forEach(a=>{state.power=state.power||{};if(!state.power[a.id])state.power[a.id]={worker:25,platform:25,client:25,mediator:25};});}
  function rememberScreen(id){if(!state?.scenario)return;const item={screen:id,snapshot:snapshotState()};const last=navHistory[navHistory.length-1];if(last&&last.screen===id)navHistory[navHistory.length-1]=item;else navHistory.push(item);if(navHistory.length>24)navHistory.shift();syncNavControls();persistNav();}
  function persistNav(){try{localStorage.setItem(NAV_KEY,JSON.stringify(navHistory));}catch(e){}}
  function loadNav(){try{const x=JSON.parse(localStorage.getItem(NAV_KEY)||'[]');navHistory=Array.isArray(x)?x:[];}catch(e){navHistory=[];}syncNavControls();}
  function clearNav(){navHistory=[];try{localStorage.removeItem(NAV_KEY);}catch(e){}syncNavControls();}

  window.syncNavControls=function(){const b=$('backBtn');if(b)b.disabled=navHistory.length<2;};
  const oldGo=go;
  go=function(id){state.mode='full';oldGo(id);if(!restoring)rememberScreen(id);};

  function rehydrateBack(id){
    if(id==='contractScreen'){renderProfile();renderWorldMap();}
    else if(id==='marketScreen')renderMarket();
    else if(id==='workScreen')setupWork(true);
    else if(id==='workResultScreen')renderWorkResult();
    else if(id==='rankingScreen')renderRankingState();
    else if(id==='rushScreen')renderSecondOffer();
    else if(id==='monitorScreen')renderMonitoring();
    else if(id==='connectionScreen')renderRiskEvent();
    else if(id==='disputeScreen')renderDispute();
    else if(id==='paymentScreen')renderPayment();
    else if(id==='suspensionScreen')renderAccessOutcome(false);
    else if(id==='caseScreen'){renderRelationMap();renderTimeline('caseTimeline');renderCaseDocs();}
    else if(id==='evidenceScreen')renderEvidenceSort();
    else if(id==='questionsScreen')renderQuestions();
    else if(id==='powerScreen')renderPower();
    else if(id==='conclusionScreen'){$('analysisText').value=state.analysisText||'';$('conclusionEvidence').innerHTML=state.evidence.map(eid=>{const e=getEvidence(eid);return `<label class="doc" style="cursor:pointer"><input type="checkbox" name="conclusionEv" value="${eid}" ${state.conclusionEvidence.includes(eid)?'checked':''} onchange="toggleConclusionEvidence('${eid}',this.checked)"> <b>${e.title}</b><p class="small">${e.text}</p></label>`}).join('');}
    else if(id==='resultScreen')renderFinalResult();
    else if(id==='rightsScreen')renderRightsScreen();
    restoring=true;oldGo(id);restoring=false;syncNavControls();
  }

  window.goBack=function(){if(navHistory.length<2){live('لا توجد خطوة سابقة متاحة.');return false;}if(!confirm('العودة إلى الخطوة السابقة ستلغي القرارات والأحداث التي وقعت بعدها. هل تريد المتابعة؟'))return false;navHistory.pop();const prev=navHistory[navHistory.length-1];restoreSnapshot(prev.snapshot);rehydrateBack(prev.screen);persistNav();live('تمت العودة إلى الخطوة السابقة وإلغاء القرارات اللاحقة.');return true;};
  window.goHome=function(){if(state?.scenario){saveGame();if(!confirm('العودة إلى الصفحة الرئيسية؟ سيتم حفظ تقدمك ويمكنك متابعة الجلسة لاحقًا.'))return;}document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));$('introScreen').classList.add('active');$('phaseLabel').textContent='قبل الوردية';$('progressShell').classList.remove('active');$('statsBar').classList.remove('active');$('gameShell').classList.remove('in-game');$('bottomActions').classList.remove('active');if(hasSavedGame())$('resumeBanner')?.classList.add('active');window.scrollTo({top:0,behavior:'smooth'});};
  window.restartGame=function(){if(state?.scenario&&!confirm('بدء محاكاة جديدة؟ سيُحذف تقدم الجولة الحالية من هذا الجهاز.'))return;discardSavedGame(false);clearNav();oldNewState();selectedMode='full';state.mode='full';state.riskApplied=false;renderWorldMap();document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));$('introScreen').classList.add('active');$('phaseLabel').textContent='قبل الوردية';$('progressShell').classList.remove('active');$('statsBar').classList.remove('active');$('gameShell').classList.remove('in-game');$('bottomActions').classList.remove('active');window.scrollTo({top:0,behavior:'smooth'});live('بدأت محاكاة جديدة.');};

  const oldSave=saveGame;
  saveGame=function(){if(state)state.mode='full';oldSave();persistNav();};
  const oldDiscard=discardSavedGame;
  discardSavedGame=function(message=true){oldDiscard(message);clearNav();};
  const oldResume=resumeGame;
  resumeGame=function(){oldResume();selectedMode='full';if(state){state.mode='full';if(state.riskApplied===undefined)state.riskApplied=false;}loadNav();if(!navHistory.length&&state?.scenario)rememberScreen(state.currentScreen||'contractScreen');};

  const oldRenderScenarioGrid=renderScenarioGrid;
  renderScenarioGrid=function(){oldRenderScenarioGrid();document.querySelectorAll('#scenarioGrid .fact').forEach(f=>{if(f.querySelector('small')?.textContent==='هدف المستحقات')f.querySelector('b').textContent=money(Object.values(scenarios).find(x=>x.role===f.closest('.scenario')?.querySelector('.muted')?.textContent.split(' · ')[0])?.goalFull||0);});};
  const oldRenderProfile=renderProfile;
  renderProfile=function(){state.mode='full';oldRenderProfile();if($('goalText'))$('goalText').textContent=`الوصول إلى ${money(currentGoal())} من المقابل المستحق قبل تكاليف التشغيل (محاكاة كاملة)`;};

  renderStats=function(){if(!state.scenario){$('statsBar').innerHTML='';return;}const total=Math.max(1,state.time),unpaidPct=Math.round(state.unpaidTime/total*100),accessLabel=state.access>=75?'مرتفع':state.access>=50?'متوسط':'منخفض',stressLabel=state.stress>=70?'مرتفع':state.stress>=40?'متوسط':'منخفض',earned=state.grossWorker;$('statsBar').innerHTML=`<div class="stat"><small>المقابل المستحق</small><b>${money(earned)}</b><div class="microbar"><i style="width:${clamp((earned/currentGoal())*100,0,100)}%;background:var(--good)"></i></div></div><div class="stat"><small>وقت الوردية</small><b>${state.time} د</b></div><div class="stat"><small>وقت مدفوع</small><b>${state.paidTime} د</b><div class="microbar"><i style="width:${clamp(state.paidTime/total*100,0,100)}%;background:var(--good)"></i></div></div><div class="stat"><small>غير مدفوع</small><b style="color:${state.unpaidTime?'var(--bad)':'inherit'}">${state.unpaidTime} د · ${unpaidPct}%</b><div class="microbar"><i style="width:${unpaidPct}%;background:var(--bad)"></i></div></div><div class="stat"><small>الجودة</small><b>${state.quality}%</b></div><div class="stat"><small>معدل القبول</small><b>${state.acceptance}%</b></div><div class="stat"><small>الوصول</small><b>${accessLabel}</b></div><div class="stat"><small>الضغط</small><b>${stressLabel}</b></div>`;$('sideStatus').textContent=state.status;$('sideScenario').textContent=state.scenario.role;};
  window.impactHTML=function(title,minutes,stressDelta=0){return `<div class="impact-card"><h3>أثر الحدث عليك</h3><p class="small">${title}</p><div class="impact-grid"><div class="impact-item"><small>وقت الوردية</small><b>+${minutes} د</b></div><div class="impact-item unpaid"><small>وقت مدفوع</small><b>+0 د</b></div><div class="impact-item unpaid"><small>المقابل الإضافي</small><b>+$0.00</b></div><div class="impact-item"><small>الضغط</small><b>${stressDelta>=0?'+':''}${stressDelta}</b></div></div><p class="small"><b>المعنى:</b> قضيت وقتًا إضافيًا مرتبطًا بالعمل، لكن مستحقاتك لم ترتفع مقابل هذا الوقت.</p></div>`;};

  rushDecision=function(accepted){state.rushAccepted=accepted;state.offerDecisions++;if(accepted){state.acceptedOffers++;recalcAcceptance();const o=state.secondOffer;state.wallet+=o.pay;state.grossWorker+=o.pay;state.clientPaid+=o.clientValue;state.time+=o.duration;state.paidTime+=o.duration;state.jobsDone++;state.stress=clamp(state.stress+(o.premium?18:22),0,100);state.access=clamp(state.access+5,0,100);addLog('قبلت العرض الثاني',`أكملت ${o.title} مقابل ${money(o.pay)}. ارتفع المقابل المستحق والوصول، وارتفع الضغط.`);$('rushMsg').innerHTML=`<div class="notice good">أضفت ${money(o.pay)} إلى مستحقاتك، لكن مؤشر الضغط ارتفع.</div>`;}else{recalcAcceptance();state.rejections++;state.access=clamp(state.access-2,0,100);state.stress=clamp(state.stress-4,0,100);addEvidence('decline');addLog('رفضت العرض الثاني','استطعت الرفض دون غرامة مالية مباشرة، لكن معدل القبول تغير.');$('rushMsg').innerHTML='<div class="notice">رفضت العرض. لم تُخصم أموال، لكن معدل القبول تغير ضمن ملف الأداء.</div>';}renderStats();saveGame();setTimeout(()=>{renderMonitoring();go('monitorScreen');},450);};
  breakDecision=function(take){state.tookBreak=take;if(take){state.time+=1;state.unpaidTime+=1;state.stress=clamp(state.stress-14,0,100);addLog('أخذت استراحة قصيرة','انخفض الضغط، وسُجلت دقيقة توقف إضافية غير مدفوعة.');$('breakMsg').innerHTML=impactHTML('اخترت استراحة قصيرة أثناء الوردية.',1,-14);}else{state.stress=clamp(state.stress+14,0,100);addLog('واصلت دون استراحة','استمر النشاط وارتفع الضغط.');$('breakMsg').innerHTML='<div class="notice">حافظت على النشاط، لكن مؤشر الضغط ارتفع. لم يضف هذا القرار وقتًا غير مدفوعًا.</div>';}renderStats();saveGame();setTimeout(()=>{renderRiskEvent();go('connectionScreen');},450);};
  renderRiskEvent=function(){if(!state.riskEvent)state.riskEvent=riskProfile();const r=state.riskEvent;if(!state.riskApplied){state.time+=r.minutes;state.unpaidTime+=r.minutes;state.stress=clamp(state.stress+r.stress,0,100);state.riskApplied=true;addLog('حدث خطر أثناء العمل',`${r.title}: ${r.minutes} دقيقة غير مدفوعة، دون مقابل إضافي.`);addEvidence('risk');}let impact=$('riskImpact');if(!impact){impact=document.createElement('div');impact.id='riskImpact';$('costGrid').before(impact);}impact.innerHTML=impactHTML(r.title,r.minutes,r.stress);$('riskIcon').textContent=r.icon;$('riskTitle').textContent=r.title;$('riskText').textContent=r.text;$('riskNotice').className='notice '+(state.scenario.type==='moderation'?'bad':'');$('riskNotice').innerHTML=`<b>من تحمل الأثر؟</b> ${r.notice}`;const c=state.scenario.costs;$('costGrid').innerHTML=`<div class="cost"><small>الإنترنت</small><b>${money(c.internet)}</b></div><div class="cost"><small>الكهرباء</small><b>${money(c.electricity)}</b></div><div class="cost"><small>استهلاك الجهاز</small><b>${money(c.device)}</b></div><div class="cost"><small>إجمالي الوقت غير المدفوع حتى الآن</small><b>${state.unpaidTime} د</b></div>`;renderStats();saveGame();};
  afterRisk=function(){renderDispute();go('disputeScreen');};

  const oldRenderPayment=renderPayment;
  renderPayment=function(){oldRenderPayment();const total=Math.max(1,state.time),pct=Math.round(state.unpaidTime/total*100),box=$('receiptBox');if(box&&!box.querySelector('[data-v110-time]'))box.insertAdjacentHTML('beforeend',`<div data-v110-time><div class="receipt-row"><span>إجمالي وقت الوردية</span><b>${state.time} د</b></div><div class="receipt-row"><span>وقت مدفوع</span><b>${state.paidTime} د</b></div><div class="receipt-row" style="color:var(--bad)"><span><b>وقت غير مدفوع</b></span><b>${state.unpaidTime} د · ${pct}%</b></div></div>`);};
  const oldRenderFinal=renderFinalResult;
  renderFinalResult=function(){oldRenderFinal();let el=$('unpaidElapsed');if(!el){const metric=document.createElement('div');metric.className='metric';metric.innerHTML='<small>الوقت غير المدفوع</small><b id="unpaidElapsed">—</b>';document.querySelector('.pilot-meta')?.insertBefore(metric,$('resultOutcome')?.closest('.metric')||null);el=$('unpaidElapsed');}if(el)el.textContent=state.unpaidTime+' د ('+Math.round(state.unpaidTime/Math.max(1,state.time)*100)+'%)';};
  const oldPayload=resultPayload;
  resultPayload=function(){const p=oldPayload();p.version='TaskBridge v1.1.0';p.mode='full';p.paidMinutes=state.paidTime;p.unpaidMinutes=state.unpaidTime;return p;};

  function upgradeUI(){
    document.title='خلف الشاشة | v1.1.0';
    const sub=document.querySelector('.subbrand');if(sub)sub.textContent='v1.1.0 · محاكاة كاملة للعمل الرقمي وعلاقات السلطة';
    const bw=document.querySelector('.brand-wrap');if(bw&&!bw.classList.contains('brand-home')){bw.classList.add('brand-home');bw.setAttribute('role','button');bw.setAttribute('tabindex','0');bw.setAttribute('aria-label','العودة إلى الصفحة الرئيسية');bw.onclick=goHome;bw.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();goHome();}};}
    if(!$('backBtn')){const actions=document.createElement('div');actions.className='top-actions';actions.innerHTML='<button class="top-action" id="backBtn" onclick="goBack()" disabled>↩ <span>رجوع</span></button><button class="top-action" onclick="restartGame()">↻ <span>بدء من جديد</span></button>';const phase=$('phaseLabel');phase?.parentElement?.insertBefore(actions,phase);}
    const quick=$('modeQuick'),full=$('modeFull');const grid=quick?.closest('.mode-grid')||full?.closest('.mode-grid');const heading=grid?.previousElementSibling;if(grid){grid.outerHTML='<div class="notice good"><b>محاكاة كاملة واحدة</b><br><span class="small">ستمر بجميع مراحل العمل، بما فيها المراقبة والمخاطر والتسوية والتحقيق.</span></div>';if(heading&&heading.textContent.includes('اختر نمط'))heading.remove();}
    const eyebrow=document.querySelector('#introScreen .eyebrow');if(eyebrow)eyebrow.textContent='محاكاة كاملة · نحو 20–25 دقيقة';
    syncNavControls();
  }

  upgradeUI();
  loadNav();
  selectedMode='full';if(state)state.mode='full';
  history.replaceState({taskbridge:true},'');history.pushState({taskbridge:true},'');window.addEventListener('popstate',()=>{if(state?.scenario&&navHistory.length>=2)goBack();history.pushState({taskbridge:true},'');});
})();
</script>
'''
              s=s.replace('</body>',upgrade+'\n</body>',1)
              p.write_text(s,encoding='utf-8')

              readme=Path('README.md').read_text(encoding='utf-8')
              readme=readme.replace('**الإصدار الحالي: v1.0.2**','**الإصدار الحالي: v1.1.0**',1)
              marker='## سجل الإصدارات\n\nتفاصيل التغييرات موثقة في [`CHANGELOG.md`](CHANGELOG.md).\n'
              if '### v1.1.0' not in readme:
                  readme=readme.replace(marker,marker+'\n### v1.1.0 — محاكاة كاملة وتنقل قابل للتراجع\n\nأزيل التدريب السريع، وأضيف توضيح مباشر للوقت المدفوع وغير المدفوع، مع الرجوع بنقاط حفظ والبدء من جديد والعودة للرئيسية من شعار TaskBridge.\n',1)
              Path('README.md').write_text(readme,encoding='utf-8')

              changelog=Path('CHANGELOG.md').read_text(encoding='utf-8')
              if '## [1.1.0]' not in changelog:
                  point='## [1.0.2] - 2026-08-20'
                  entry='''## [1.1.0] - 2026-08-20\n\n### Added\n- رجوع بنقاط حفظ يلغي القرارات اللاحقة عند العودة.\n- بدء من جديد من أي مرحلة، والعودة للرئيسية من شعار TaskBridge مع حفظ التقدم.\n- إظهار وقت الوردية والوقت المدفوع وغير المدفوع بشكل منفصل.\n- بطاقات أثر فورية لأحداث الوقت غير المدفوع.\n- عرض الوقت غير المدفوع ونسبته في التسوية والنتيجة.\n\n### Changed\n- إلغاء التدريب السريع واعتماد المحاكاة الكاملة بوصفها المسار الوحيد.\n- المرور دائمًا بمرحلة المراقبة.\n- تطبيق أثر المخاطر لحظة ظهور الحدث بدل تأجيله إلى زر المتابعة.\n\n'''
                  changelog=changelog.replace(point,entry+point,1)
              Path('CHANGELOG.md').write_text(changelog,encoding='utf-8')
              Path('RELEASE_NOTES_v1.1.0.md').write_text('''# Release v1.1.0 — Full Simulation UX\n\n- محاكاة كاملة واحدة دون نمط سريع.\n- الوقت المدفوع وغير المدفوع واضحان طوال الوردية وفي التسوية والنتيجة.\n- أحداث التأخير وإعادة العمل والانقطاع والتعافي تعرض أثرها فورًا: وقت إضافي مقابل صفر زيادة في المستحقات.\n- رجوع حقيقي بنقاط حفظ، وبدء من جديد، وشعار يعيد للرئيسية مع حفظ الجلسة.\n- دعم زر Back في المتصفح داخل المحاكاة.\n\nلا يغير هذا الإصدار السيناريوهات الأساسية أو نموذج تحليل السلطة أو درجة الاتساق.\n''',encoding='utf-8')

              for wf in [Path('.github/workflows/release-v1.1.0.yml'),Path('.github/workflows/release-v1.1.0-v2.yml')]:
                  if wf.exists(): wf.unlink()
          except Exception:
              Path('V1.1.0_FAILURE.txt').write_text(traceback.format_exc(),encoding='utf-8')
              raise
          PY

      - name: Validate JavaScript
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          for x in ['taskbridge-v110-upgrade','function(){','v1.1.0','goBack','restartGame','impactHTML','unpaidMinutes']:
              if x not in s: raise SystemExit('Missing '+x)
          if 'id="modeQuick"' in s: raise SystemExit('Quick-mode UI remains in source')
          scripts=re.findall(r'<script[^>]*>(.*?)</script>',s,re.S)
          Path('/tmp/all.js').write_text('\n'.join(scripts),encoding='utf-8')
          print('Feature validation passed')
          PY
          node --check /tmp/all.js

      - name: Commit release
        if: success()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(simulation): release v1.1.0 full simulation UX" -m "Remove quick mode; surface paid and unpaid time throughout the shift; add immediate impact cards, checkpoint back navigation, restart/home controls, browser-back integration, and release documentation."
          git push origin main
